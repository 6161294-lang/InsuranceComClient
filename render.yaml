# Render Blueprint: the React client as a static site. The API is a separate service (InsuranceComServer).
services:
  - type: web
    name: insurance-claims-client
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Public URL of the deployed API, e.g. https://insurance-claims-api.onrender.com (build time, no trailing slash)
      - key: VITE_API_URL
        sync: false
    routes:
      # Client-side routes fall back to index.html, so refreshing a page works.
      - type: rewrite
        source: /*
        destination: /index.html
